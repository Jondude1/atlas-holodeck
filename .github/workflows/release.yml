name: Build & release APK

# Every push to main builds a signed Quest APK and publishes it as a GitHub Release.
# Versions continue from Jon's hand builds: v2.2, v2.3, ... The in-headset updater (app/updater.gd) reads
# releases/latest and installs it.
# Pull requests and manual runs build and verify the APK (downloadable as a run artifact) but publish nothing.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "builds/**"
      - "captures/**"
      - "design/**"
      - "cad/**"
      - "cad-jobs/**"
      - "parked/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"
  # The one permanent release key (committed on purpose, see .gitignore). Every release must use it, or
  # Android refuses the update.
  KEYSTORE: keystore/atlas-holodeck.jks
  KEY_ALIAS: atlasholodeck
  KEY_PASS: atlasholodeck

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot, Android export templates, Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Install Godot ${{ env.GODOT_VERSION }} + Android templates
        run: |
          V="$GODOT_VERSION"
          REL="https://github.com/godotengine/godot-builds/releases/download/${V}-stable"
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot
            curl -fsSL -o /tmp/godot.zip "$REL/Godot_v${V}-stable_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d /tmp/godot
            mv "/tmp/godot/Godot_v${V}-stable_linux.x86_64" ~/godot/godot
            rm -rf /tmp/godot /tmp/godot.zip
          fi
          T=~/.local/share/godot/export_templates/${V}.stable
          if [ ! -f "$T/version.txt" ]; then
            curl -fsSL -o /tmp/templates.tpz "$REL/Godot_v${V}-stable_export_templates.tpz"
            mkdir -p "$T" /tmp/tpl
            unzip -q /tmp/templates.tpz 'templates/android_*' 'templates/version.txt' -d /tmp/tpl
            mv /tmp/tpl/templates/* "$T"/
            rm -rf /tmp/tpl /tmp/templates.tpz
          fi
          ~/godot/godot --version

      - name: Stamp version (2.<n>, one past the latest release; Jon's hand builds went up to v2.1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          case "$LAST" in v2.*) PREV="${LAST##*.}" ;; *) PREV=1 ;; esac
          N=$((PREV + 1))
          VER="2.${N}"
          # versionCode = N too: the updater compares the trailing number of the tag with the installed version.
          sed -i "s|^version/code=.*|version/code=${N}|; s|^version/name=.*|version/name=\"${VER}\"|" app/export_presets.cfg
          sed -i "s|^config/version=.*|config/version=\"${VER}\"|" app/project.godot
          grep -E '^version/(code|name)=' app/export_presets.cfg
          grep '^config/version=' app/project.godot
          echo "VER=${VER}" >> "$GITHUB_ENV"
          echo "APK=builds/AtlasHolodeck-v${VER}.apk" >> "$GITHUB_ENV"

      - name: Fetch OpenXR vendors addon (Meta Quest manifest support)
        run: VENDORS_DL_DIR="$RUNNER_TEMP/vendors" bash app/fetch_addons.sh

      - name: Import + export signed APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ env.KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ env.KEY_PASS }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ${{ env.KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ env.KEY_PASS }}
        run: |
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$GITHUB_WORKSPACE/$KEYSTORE"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$GITHUB_WORKSPACE/$KEYSTORE"
          # Release builds are public: never bake the hub token in (Hub.token() reads it from the headset instead).
          rm -f app/hub_secret.cfg
          mkdir -p builds
          ~/godot/godot --headless --path app --import
          ~/godot/godot --headless --path app --install-android-build-template \
            --export-release "Android" "$GITHUB_WORKSPACE/$APK"
          test -s "$APK"
          ls -l "$APK"

      - name: Verify APK (signature, Quest XR, permissions, no token)
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -q "CN=Atlas Holodeck" /tmp/certs.txt || { echo "::error::APK is not signed with the release key"; exit 1; }
          unzip -p "$APK" assets/_cl_ | strings | grep -q -- "--xr_mode_openxr" || { echo "::error::_cl_ lacks --xr_mode_openxr"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libopenxr_loader.so" || { echo "::error::libopenxr_loader.so missing"; exit 1; }
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/manifest.txt
          for need in android.permission.REQUEST_INSTALL_PACKAGES android.permission.RECORD_AUDIO com.oculus.intent.category.VR; do
            grep -q "$need" /tmp/manifest.txt || { echo "::error::manifest lacks $need"; exit 1; }
          done
          if unzip -l "$APK" | grep -q hub_secret; then echo "::error::hub token baked into a public APK"; exit 1; fi
          "$BT/aapt2" dump badging "$APK" | head -1

      - name: Upload APK as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtlasHolodeck-v${{ env.VER }}
          path: ${{ env.APK }}
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: Atlas Holodeck v${{ env.VER }}
          make_latest: true
          files: ${{ env.APK }}
          body: |
            Automatic build of ${{ github.sha }}: ${{ github.event.head_commit.message }}

            The headset picks this up by itself (the version button next to ATLAS HOLODECK on the panel).
            First install only: sideload this APK with SideQuest.
